<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Арканоид — браузерная игра: 5 уровней, бонусы, темы оформления. Работает на компьютере и телефоне.">
<meta name="theme-color" content="#4a6cf7">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<title>Арканоид — играй онлайн</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap');
  :root {
    --page: #eef1f6; --card: #ffffff; --text: #2b3550; --muted: #6b7691;
    --accent: #4a6cf7; --accent-h: #3a5ae5; --shadow: rgba(40,55,90,.15);
    --border: none;
  }
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; }
  body {
    background:var(--page);
    height:100vh; height:100dvh; overflow:hidden;
    width:100vw; position:fixed; inset:0;   /* жёсткая оболочка приложения, ничего не вылезает */
    display:flex; flex-direction:column;
    font-family:'Rubik',Arial,sans-serif;
    transition: background .3s;
  }
  /* --- шапка приложения --- */
  header {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 12px; gap:12px;
    padding-left:max(12px, env(safe-area-inset-left));
    padding-right:max(12px, env(safe-area-inset-right));
    flex-shrink:0;
  }
  header h1 { color:var(--text); font-size:18px; font-weight:700; letter-spacing:.5px; }
  #themes { display:flex; gap:8px; flex-shrink:0; }
  #themes button {
    width:24px; height:24px; border-radius:50%;
    border:2.5px solid transparent; cursor:pointer; transition:.15s;
  }
  #themes button.sel { border-color:var(--text); transform:scale(1.12); }
  /* во время игры темы скрыты */
  body.playing #themes { display:none; }
  /* --- игровое поле занимает всё место --- */
  #wrap {
    position:relative; flex:1 1 auto; width:100%; min-height:0;
    padding:0 8px;
    padding-left:max(8px, env(safe-area-inset-left));
    padding-right:max(8px, env(safe-area-inset-right));
    display:flex; overflow:hidden;
  }
  canvas {
    flex:1; width:100%; height:100%; display:block;
    background:var(--card);
    border-radius:14px;
    border:var(--border);
    transition: background .3s;
    touch-action:none;
  }
  /* --- кнопка паузы: только телефон, левый верхний угол, во время игры --- */
  #pauseBtn {
    display:none;
    width:36px; height:36px; border-radius:50%;
    background:var(--card); color:var(--text);
    border:1px solid var(--muted); font-size:15px; cursor:pointer;
    box-shadow:0 2px 8px var(--shadow);
  }
  #pauseBtn:active { transform:scale(.9); background:var(--accent); color:#fff; }
  @media (pointer:coarse) { body.playing #pauseBtn { display:block; } }

  #overlay {
    position:absolute; inset:10px 10px 6px 10px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:var(--card);
    opacity:.96; border-radius:16px; gap:14px; text-align:center; padding:16px;
  }
  #overlay h2 { color:var(--text); font-size:24px; }
  #overlay p { color:var(--muted); font-size:13px; line-height:1.7; max-width:420px; }
  .ctrl { display:flex; gap:10px; }
  .ctrl button {
    background:transparent; border:1px solid var(--muted); color:var(--muted);
    font-family:inherit; padding:9px 16px; border-radius:22px; cursor:pointer; font-size:13px; transition:.15s;
  }
  .ctrl button.sel { border-color:var(--accent); color:var(--accent); font-weight:500; }
  .btn {
    background:var(--accent); border:none; color:#fff; font-family:inherit;
    font-size:15px; font-weight:500; letter-spacing:.5px;
    padding:13px 44px; border-radius:24px; cursor:pointer; transition:.15s;
    box-shadow:0 4px 14px var(--shadow);
  }
  .btn:hover { background:var(--accent-h); }
  .btn:active { transform:scale(.96); }
  /* --- нижняя панель как в приложении --- */
  #hud {
    display:flex; gap:8px; padding:10px 8px 14px; flex-shrink:0;
    padding-left:max(8px, env(safe-area-inset-left));
    padding-right:max(8px, env(safe-area-inset-right));
  }
  #hud div {
    flex:1; background:var(--card); border-radius:14px; padding:9px 6px;
    box-shadow:0 2px 8px var(--shadow); border:var(--border);
    color:var(--muted); font-size:11px; text-align:center; letter-spacing:.5px;
  }
  #hud b { color:var(--text); font-size:17px; margin-left:5px; display:block; margin-top:2px; }
  @media (min-width: 801px) {
    #wrap { max-width:900px; margin:0 auto; }
    #hud { max-width:900px; margin:0 auto; width:100%; }
    header { max-width:920px; margin:0 auto; width:100%; }
  }
</style>
</head>
<body>
<header>
  <button id="pauseBtn" title="Пауза">⏸</button>
  <div id="themes"></div>
</header>
<div id="wrap">
  <canvas id="c" width="760" height="600"></canvas>
  <div id="overlay">
    <h2 id="otitle">Арканоид</h2>
    <p id="otext">Разбей все блоки!<br>Веди пальцем — платформа едет за ним. Тап — запуск мяча.<br>Кружки на блоках дают бонус!</p>
    <div class="ctrl">
      <button data-c="mouse" class="sel">Палец / Мышь</button>
      <button data-c="keys">⌨ Стрелки / A D</button>
    </div>
    <button class="btn" id="startBtn">Играть</button>
  </div>
</div>
<div id="hud">
  <div>ОЧКИ<b id="score">0</b></div>
  <div>УРОВЕНЬ<b id="level">1</b></div>
  <div>ЖИЗНИ<b id="lives">3</b></div>
</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 760;              // логическая ширина фиксирована
let H = 600;                // высота подстраивается под экран

// мобильная версия: немного быстрее мяч и платформа
const IS_MOBILE = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || matchMedia('(pointer:coarse)').matches;
const SPD = IS_MOBILE ? 1.5 : 1;   // ускорение мяча
const PSPD = IS_MOBILE ? 1.25 : 1; // ускорение платформы
const overlay = document.getElementById('overlay');

// ---------- темы ----------
const THEMES = {
  light: {
    name:'Светлая', dot:'#ffffff',
    page:'#eef1f6', card:'#ffffff', text:'#2b3550', muted:'#6b7691',
    accent:'#4a6cf7', accentH:'#3a5ae5', shadow:'rgba(40,55,90,.15)', border:'none',
    bricks:['#ef5350','#ff8a50','#ffd54f','#81c784','#64b5f6','#7986cb'],
    paddle:'#4a6cf7', ball:'#2b3550', shine:'rgba(255,255,255,.22)',
    shadeStep:45,
  },
  dark: {
    name:'Тёмная', dot:'#24293a',
    page:'#161923', card:'#222736', text:'#e8ecf5', muted:'#8b93a8',
    accent:'#5b7cfa', accentH:'#4a6ae8', shadow:'rgba(0,0,0,.4)', border:'1px solid #2e3448',
    bricks:['#e57373','#ffb74d','#fff176','#81c784','#64b5f6','#9575cd'],
    paddle:'#5b7cfa', ball:'#e8ecf5', shine:'rgba(255,255,255,.15)',
    shadeStep:40,
  },
  paper: {
    name:'Тёплая', dot:'#f3e7d8',
    page:'#e9dcc8', card:'#faf3e8', text:'#4b3f2f', muted:'#8a7a63',
    accent:'#c06a3a', accentH:'#a8582c', shadow:'rgba(90,70,40,.18)', border:'none',
    bricks:['#d9825f','#e0a458','#d9c26a','#9db36b','#6da39b','#b08487'],
    paddle:'#c06a3a', ball:'#4b3f2f', shine:'rgba(255,255,255,.3)',
    shadeStep:40,
  },
  mint: {
    name:'Мятная', dot:'#d7f0e4',
    page:'#dcefe7', card:'#f4fbf7', text:'#1f4a3a', muted:'#5f8a7a',
    accent:'#1f9d6f', accentH:'#17855c', shadow:'rgba(30,80,60,.15)', border:'none',
    bricks:['#ef8a7a','#f2b56b','#e8d477','#8fce8f','#6fb8d4','#a5a3d8'],
    paddle:'#1f9d6f', ball:'#1f4a3a', shine:'rgba(255,255,255,.3)',
    shadeStep:40,
  },
};
let theme = THEMES.light;
function applyTheme(key){
  theme = THEMES[key];
  const r = document.documentElement.style;
  r.setProperty('--page', theme.page);
  r.setProperty('--card', theme.card);
  r.setProperty('--text', theme.text);
  r.setProperty('--muted', theme.muted);
  r.setProperty('--accent', theme.accent);
  r.setProperty('--accent-h', theme.accentH);
  r.setProperty('--shadow', theme.shadow);
  r.setProperty('--border', theme.border);
  document.querySelectorAll('#themes button').forEach(b=>b.classList.toggle('sel', b.dataset.t===key));
}
const themesBox = document.getElementById('themes');
Object.entries(THEMES).forEach(([key,th])=>{
  const b = document.createElement('button');
  b.title = th.name; b.dataset.t = key;
  b.style.background = th.dot;
  b.onclick = ()=>{ if(!playing){ applyTheme(key); beep(700,.05,'triangle',.06); } else beep(200,.05,'square',.05); };
  themesBox.appendChild(b);
});
applyTheme('light');

// пауза: кнопка (телефон) и пробел (ПК)
document.getElementById('pauseBtn').onclick = e => {
  e.stopPropagation();
  if(!playing) return;
  if(launch) fire(); else paused = !paused;
  beep(paused?300:600,.06,'triangle',.06);
};

// выбор управления
document.querySelectorAll('.ctrl button').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('.ctrl button').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    controlMode = b.dataset.c;
    beep(700,.05,'triangle',.06);
  };
});

// ---------- config (зависит от экрана: на телефоне блоков больше) ----------
const PW = 110, PH = 14, BR = 8, GAP = 6;
const BW = IS_MOBILE ? 74 : 62;                 // крупные блоки
const BH = IS_MOBILE ? 42 : 24;
const COLS = Math.floor((W - 48) / (BW + GAP)); // ~8 колонок
const ROWS = IS_MOBILE ? 12 : 6;                // рядов больше — сетка уходит ниже
const GRID_Y = IS_MOBILE ? 100 : 60;            // старт сетки ниже на телефоне
const GRID_X = Math.round((W - (COLS*(BW+GAP) - GAP)) / 2); // сетка по центру
const BONUS_TYPES = [
  {id:'wide',  color:'#66bb6a', label:'W'},
  {id:'multi', color:'#ab47bc', label:'3x'},
  {id:'slow',  color:'#29b6f6', label:'S'},
  {id:'life',  color:'#ef5350', label:'♥'},
];

let paddle, balls, bricks, bonuses, particles, score, lives, level;
let playing=false, paused=false, launch=true, shake=0, t=0, mouseX=W/2, keys={}, controlMode='mouse', paddleVX=0, levelBanner=0;

// ---------- audio ----------
let AC=null;
function beep(f,d=.06,type='square',v=.08){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(v,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);
  }catch(e){}
}

// ---------- уровни: у каждого свой узор ----------
function buildLevel(n){
  bricks=[];
  const midL = Math.floor(COLS/2);
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    let skip=false, steel=false, move=0;
    switch(n){
      case 1: // сплошная стена
        break;
      case 2: // шахматка + стальная рамка сверху
        skip = (r+c)%2===1;
        steel = r===0 && (c===0 || c===COLS-1);
        break;
      case 3: // пирамида + движущиеся блоки по краям
        skip = c < midL - r && c > midL - 1 + r ? false : Math.abs(c - (midL-0.5)) > r+1;
        skip = Math.abs(c - (midL-0.5)) > r+1;
        if(!skip && (c===0 || c===COLS-1) && r<3) move = c===0 ? 1.2 : -1.2;
        break;
      case 4: // колонны с стальными перемычками
        skip = c%2===1 && r<4;
        steel = r===3 && c%2===0;
        break;
      case 5: // ромб-босс: плотный центр, стальная броня, движение
        skip = Math.abs(Math.abs(c - (midL-0.5)) + Math.abs(r - (ROWS-1)/2)) > 5;
        steel = r===Math.floor(ROWS/2) && Math.abs(c-(midL-0.5))<2;
        if(!skip) move = (r%2===0 ? 1 : -1) * 1.0;
        break;
    }
    if(skip) continue;
    bricks.push({
      x: GRID_X + c*(BW+GAP), y: GRID_Y + r*(BH+GAP),
      hp: steel ? Infinity : Math.min(1 + Math.floor(n/3) + Math.floor((ROWS-1-r)/3), 3),
      color: theme.bricks[(r+n)%theme.bricks.length],
      steel,
      bonus: (!steel && Math.random()<0.13) ? BONUS_TYPES[Math.floor(Math.random()*BONUS_TYPES.length)] : null,
    });
    if(move){
      bricks[bricks.length-1].vx = move;
      bricks[bricks.length-1].ox = bricks[bricks.length-1].x;
    }
  }
}

function reset(full){
  if(full){ score=0; lives=3; level=1; buildLevel(level); }
  paddle = { x: W/2-PW/2, w: PW, targetW: diffPaddle(level) };
  bonuses=[]; particles=[];
  balls=[{ x:W/2, y:H-60, vx:0, vy:0, stuck:true }];
  launch=true;
  updHUD();
}

// ---------- input ----------
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Space'){ e.preventDefault();
    if(playing){ if(launch) fire(); else paused=!paused; }
  }
});
addEventListener('keyup',e=>keys[e.code]=false);
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect();
  mouseX=(e.clientX-r.left)*(W/r.width);
});
cv.addEventListener('mousedown',()=>{ if(playing&&launch) fire(); });

// --- сенсорное управление: палец всегда рулит платформой ---
cv.addEventListener('touchstart', e=>{
  e.preventDefault();
  controlMode='mouse';
  const r=cv.getBoundingClientRect();
  mouseX=(e.touches[0].clientX-r.left)*(W/r.width);
  if(playing&&launch) fire();
}, {passive:false});
cv.addEventListener('touchmove', e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  mouseX=(e.touches[0].clientX-r.left)*(W/r.width);
}, {passive:false});

// сложность растёт с уровнем
function diffSpeed(n){ return 5.5 + (n-1)*0.8; }        // базовая скорость мяча
function diffPaddle(n){ return Math.max(PW - (n-1)*10, 70); } // уже каждый уровень
function diffMaxSp(n){ return 9 + (n-1)*0.7; }          // потолок скорости

// --- поле растягивается на всё свободное место (внутр. разрешение под контейнер) ---
function fitCanvas(){
  const r = cv.getBoundingClientRect();
  const cssW = r.width || W, cssH = r.height || H;
  const newW = Math.round(W);
  const newH = Math.max(420, Math.round(W * cssH / cssW));
  if (cv.width !== newW || cv.height !== newH){
    cv.width = newW; cv.height = newH;
    H = newH;
    // не даём объектам выйти за границы после смены размера
    if(paddle) paddle.y = H-40;
    if(balls) balls.forEach(b=>{ if(b.stuck) b.y = H-40-PH-BR; });
  }
}
addEventListener('resize', fitCanvas);
new ResizeObserver(fitCanvas).observe(cv);
requestAnimationFrame(fitCanvas);

function fire(){
  const b=balls[0], sp=diffSpeed(level)*SPD;
  const ang=(Math.random()*.6-.3);
  b.stuck=false; b.vx=sp*Math.sin(ang); b.vy=-sp*Math.cos(ang);
  launch=false; beep(500,.08,'triangle');
}

function burst(x,y,color,n=14,p=4,shards=false){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=Math.random()*p+1;
    if(shards && Math.random()<.5){
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,color,
        shard:true,rot:Math.random()*7,vr:(Math.random()-.5)*.4,w:4+Math.random()*7,h:3+Math.random()*4});
    } else {
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color});
    }
  }
}
function updHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('level').textContent=level;
  document.getElementById('lives').textContent=lives;
}

// ---------- update ----------
function update(){
  // платформа — только выбранный способ управления
  if(controlMode==='mouse'){
    const tx = mouseX - paddle.w/2;
    paddle.x += (tx-paddle.x) * (IS_MOBILE ? 0.22 : 0.14);
    paddleVX = 0;
  } else {
    const left = keys['ArrowLeft']||keys['KeyA'], right = keys['ArrowRight']||keys['KeyD'];
    if(left)  paddleVX = Math.max(paddleVX-0.3*PSPD, -5*PSPD);
    else if(right) paddleVX = Math.min(paddleVX+0.3*PSPD, 5*PSPD);
    else paddleVX *= 0.94;
    paddle.x += paddleVX;
  }
  paddle.w += (paddle.targetW-paddle.w)*0.15;
  paddle.x = Math.max(6, Math.min(W-6-paddle.w, paddle.x));

  // движение блоков
  bricks.forEach(br=>{
    if(!br.vx) return;
    br.x += br.vx;
    if(br.x < 12 || br.x + BW > W-12){ br.vx*=-1; br.x = Math.max(12, Math.min(W-12-BW, br.x)); }
  });

  balls.forEach(b=>{
    if(b.stuck){
      b.x = paddle.x + paddle.w/2; b.y = H-40-PH-BR;
      return;
    }
    b.x+=b.vx; b.y+=b.vy;

    if(b.x<BR){b.x=BR;b.vx*=-1;beep(280);}
    if(b.x>W-BR){b.x=W-BR;b.vx*=-1;beep(280);}
    if(b.y<BR){b.y=BR;b.vy*=-1;beep(280);}

    const py=H-40;
    if(b.vy>0 && b.y+BR>py && b.y+BR<py+PH+12 && b.x>paddle.x-BR && b.x<paddle.x+paddle.w+BR){
      const rel=((b.x-(paddle.x+paddle.w/2))/(paddle.w/2));
      const sp=Math.min(Math.hypot(b.vx,b.vy)*1.02, diffMaxSp(level)*SPD);
      const ang=rel*1.05;
      b.vx=sp*Math.sin(ang); b.vy=-Math.abs(sp*Math.cos(ang));
      b.y=py-BR;
      burst(b.x,py,theme.accent,6,3); beep(440,.05);
    }

    for(const br of bricks){
      if(b.x+BR>br.x && b.x-BR<br.x+BW && b.y+BR>br.y && b.y-BR<br.y+BH){
        const ox=Math.min(b.x+BR-br.x, br.x+BW-(b.x-BR));
        const oy=Math.min(b.y+BR-br.y, br.y+BH-(b.y-BR));
        if(ox<oy) b.vx*=-1; else b.vy*=-1;
        if(br.steel){ // неразрушимый — только искры
          burst(b.x,b.y,'#b8bec9',6,3,true);
          beep(220,.04,'square');
          break;
        }
        br.hp--;
        if(br.hp<=0){
          score+=10*level;
          burst(br.x+BW/2,br.y+BH/2,br.color,14,5,true);
          if(br.bonus) bonuses.push({x:br.x+BW/2,y:br.y+BH/2,t:br.bonus});
          bricks.splice(bricks.indexOf(br),1);
          beep(600+Math.random()*200,.07,'square');
        } else {
          burst(b.x,b.y,br.color,6,3,true);
          beep(350,.04);
        }
        break;
      }
    }
  });

  balls = balls.filter(b=>b.y < H+30);
  if(balls.length===0){
    lives--;
    updHUD();
    beep(120,.35,'sawtooth',.1);
    if(lives<=0){ gameOver(false); return; }
    balls=[{x:W/2,y:H-60,vx:0,vy:0,stuck:true}];
    paddle.targetW=diffPaddle(level); launch=true;
  }

  bonuses.forEach(bo=>{ bo.y+=2.2; });
  const py=H-40;
  bonuses=bonuses.filter(bo=>{
    if(bo.y>H+20) return false;
    if(bo.y>py-10 && bo.y<py+PH+10 && bo.x>paddle.x-12 && bo.x<paddle.x+paddle.w+12){
      applyBonus(bo.t); return false;
    }
    return true;
  });

  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life-=.03;if(p.shard)p.rot+=p.vr;});
  particles=particles.filter(p=>p.life>0);

  // шлейф мяча
  balls.forEach(b=>{
    if(b.stuck) return;
    b.trail = b.trail||[];
    b.trail.push({x:b.x,y:b.y});
    if(b.trail.length>10) b.trail.shift();
  });

  // уровень пройден (стальные не считаются)
  if(bricks.filter(b=>!b.steel).length===0){
    level++;
    if(level>5){ gameOver(true); return; }
    beep(800,.2,'triangle',.12);
    reset(false);
    levelBanner = 130; // анимация "Уровень N"
  }
}

function applyBonus(t){
  beep(900,.15,'triangle',.12);
  burst(paddle.x+paddle.w/2, H-40, t.color, 18, 5);
  if(t.id==='wide') paddle.targetW=Math.min(paddle.w+45, 220);
  if(t.id==='slow') balls.forEach(b=>{b.vx*=.7;b.vy*=.7;});
  if(t.id==='life'){ lives=Math.min(lives+1,5); }
  if(t.id==='multi' && balls.length<3){
    const src=balls[0];
    for(const a of [-0.5,0.5]){
      const sp=Math.hypot(src.vx,src.vy)||5;
      balls.push({x:src.x,y:src.y,vx:sp*Math.sin(a),vy:-Math.abs(sp*Math.cos(a)),stuck:false});
    }
  }
  updHUD();
}

function gameOver(win){
  playing=false;
  document.body.classList.remove('playing');
  showOverlay(
    win ? 'Победа! 🏆' : 'Игра окончена',
    `Очки: ${score} · Уровень: ${level}<br>${win?'Все 5 уровней пройдены!':'Удачи в следующий раз!'}`,
    'Заново'
  );
  if(win) beep(1000,.5,'triangle',.15);
}

// ---------- draw ----------
function draw(){
  ctx.save();
  if(shake>.5) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);

  ctx.fillStyle=theme.card; ctx.fillRect(-20,-20,W+40,H+40);

  // блоки
  bricks.forEach(br=>{
    if(br.steel){
      // стальной блок
      ctx.fillStyle='#9aa3b2';
      ctx.beginPath(); ctx.roundRect(br.x,br.y,BW,BH,5); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.45)';
      ctx.beginPath(); ctx.roundRect(br.x+2,br.y+2,BW-4,6,3); ctx.fill();
      ctx.strokeStyle='rgba(60,70,90,.5)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.roundRect(br.x+1,br.y+1,BW-2,BH-2,4); ctx.stroke();
      ctx.fillStyle='rgba(60,70,90,.6)'; ctx.font='700 11px Rubik'; ctx.textAlign='center';
      ctx.fillText('▬', br.x+BW/2, br.y+BH/2+4);
      return;
    }
    ctx.fillStyle = br.hp>=3 ? shade(br.color,-theme.shadeStep) : br.hp===2 ? br.color : shade(br.color,theme.shadeStep);
    ctx.beginPath(); ctx.roundRect(br.x,br.y,BW,BH,5); ctx.fill();
    ctx.fillStyle=theme.shine;
    ctx.beginPath(); ctx.roundRect(br.x+2,br.y+2,BW-4,7,4); ctx.fill();
    if(br.bonus){
      ctx.fillStyle='rgba(255,255,255,.95)'; ctx.font=`700 ${IS_MOBILE?15:11}px Rubik`; ctx.textAlign='center';
      ctx.fillText(br.bonus.label, br.x+BW/2, br.y+BH/2+5);
    }
    if(br.hp>1){
      ctx.fillStyle='rgba(255,255,255,.85)'; ctx.font=`700 ${IS_MOBILE?14:10}px Rubik`; ctx.textAlign='left';
      ctx.fillText(br.hp, br.x+6, br.y+19);
    }
  });

  // частицы
  particles.forEach(p=>{
    ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
    if(p.shard){
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,7); ctx.fill();
    }
  });
  ctx.globalAlpha=1;

  // бонусы
  bonuses.forEach(bo=>{
    ctx.fillStyle=bo.t.color;
    ctx.beginPath(); ctx.arc(bo.x,bo.y,10,0,7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='700 10px Rubik'; ctx.textAlign='center';
    ctx.fillText(bo.t.label, bo.x, bo.y+3.5);
  });

  // платформа
  ctx.fillStyle=theme.paddle;
  ctx.beginPath(); ctx.roundRect(paddle.x,H-40,paddle.w,PH,7); ctx.fill();
  ctx.fillStyle=theme.shine;
  ctx.beginPath(); ctx.roundRect(paddle.x+3,H-38,paddle.w-6,4,2); ctx.fill();

  // шлейф и мячи
  balls.forEach(b=>{
    if(b.trail) b.trail.forEach((p,i)=>{
      ctx.globalAlpha=(i/b.trail.length)*.3;
      ctx.fillStyle=theme.ball;
      ctx.beginPath(); ctx.arc(p.x,p.y,BR*(i/b.trail.length),0,7); ctx.fill();
    });
    ctx.globalAlpha=1;
    ctx.fillStyle=theme.ball;
    ctx.beginPath(); ctx.arc(b.x,b.y,BR,0,7); ctx.fill();
  });

  // баннер "Уровень N"
  if(levelBanner>0 && playing){
    levelBanner--;
    const prog = 1 - levelBanner/130;             // 0..1
    const ease = prog<.15 ? prog/.15 : prog>.85 ? (1-prog)/.15 : 1;
    ctx.globalAlpha = ease;
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.fillRect(0, H/2-46, W, 92);
    ctx.fillStyle=theme.text; ctx.font='700 40px Rubik'; ctx.textAlign='center';
    ctx.fillText(`Уровень ${level}`, W/2, H/2+14);
    ctx.globalAlpha=1;
  }

  if(launch&&playing){
    ctx.fillStyle=theme.muted; ctx.font='13px Rubik'; ctx.textAlign='center';
    ctx.fillText('Пробел или клик — запуск мяча', W/2, H-95);
  }

  ctx.restore();
}

// затемнение/осветление hex-цвета
function shade(hex, amt){
  const n=parseInt(hex.slice(1),16);
  const r=Math.max(0,Math.min(255,(n>>16)+amt));
  const g=Math.max(0,Math.min(255,((n>>8)&255)+amt));
  const b=Math.max(0,Math.min(255,(n&255)+amt));
  return `rgb(${r},${g},${b})`;
}

function loop(){
  t++;
  if(playing&&!paused) update();
  draw();
  if(paused&&playing){
    ctx.fillStyle=theme.card==='#ffffff'?'rgba(255,255,255,.65)':'rgba(20,24,36,.6)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle=theme.text; ctx.font='700 30px Rubik'; ctx.textAlign='center';
    ctx.fillText('Пауза',W/2,H/2);
  }
  requestAnimationFrame(loop);
}

function showOverlay(title,text,btn){
  document.getElementById('otitle').textContent=title;
  document.getElementById('otext').innerHTML=text;
  document.getElementById('startBtn').textContent=btn;
  overlay.style.display='flex';
}
document.getElementById('startBtn').onclick=()=>{
  overlay.style.display='none';
  reset(true); playing=true; paused=false;
  document.body.classList.add('playing');
  beep(600,.1,'triangle');
};

reset(true);
loop();
</script>
